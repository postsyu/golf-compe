# Supabase の無料プランは 1 週間使われないと一時停止するため、
# 3 日おきに軽い問い合わせを 1 回送って停止を防ぐ
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 21 */3 * *' # 日本時間 6:17（3 日おき）
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          headers=(-H "apikey: $KEY" -H "Content-Type: application/json")
          if [[ "$KEY" == eyJ* ]]; then headers+=(-H "Authorization: Bearer $KEY"); fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/api_dashboard_version" \
            "${headers[@]}" -d '{"p_public_token":"keepalive"}')
          echo "HTTP $code"
          test "$code" = "200"
